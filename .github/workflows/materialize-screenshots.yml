name: materialize screenshots
on:
  push:
    paths:
      - '.github/workflows/materialize-screenshots.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Scout chat PNGs
        env:
          CHAT_URL: 'https://uploads.linear.app/df6e40bb-b470-4d4d-b4f5-87152f63d6da/0fb302cb-0ed1-45e3-9572-54153a7c32e0/19ee4e7d-edf4-4fba-8676-015b8696e7fc?signature=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJwYXRoIjoiL2RmNmU0MGJiLWI0NzAtNGQ0ZC1iNGY1LTg3MTUyZjYzZDZkYS8wZmIzMDJjYi0wZWQxLTQ1ZTMtOTU3Mi01NDE1M2E3YzMyZTAvMTllZTRlN2QtZWRmNC00ZmJhLTg2NzYtMDE1Yjg2OTZlN2ZjIiwiaWF0IjoxNzg5MTY5ODM1LCJleHAiOjE3ODkxNzAxMzV9.ZFkou_j7AEovRn0Vt4u0NdZIFP7G4e97yP0LX2kPFig'
          CHROME_URL: 'https://uploads.linear.app/df6e40bb-b470-4d4d-b4f5-87152f63d6da/cb06607d-c688-47a2-9522-85686116a97e/017f748f-efa8-4f7c-823c-b015330245f5?signature=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJwYXRoIjoiL2RmNmU0MGJiLWI0NzAtNGQ0ZC1iNGY1LTg3MTUyZjYzZDZkYS9jYjA2NjA3ZC1jNjg4LTQ3YTItOTUyMi04NTY4NjExNmE5N2UvMDE3Zjc0OGYtZWZhOC00ZjdjLTgyM2MtYjAxNTMzMDI0NWY1IiwiaWF0IjoxNzg5MTY5OTQyLCJleHAiOjE3ODkxNzAyNDJ9.wNWU9Pd9Uyc1xdzFKtAxEn1wk5uSrhwyd8gNw_d76PI'
        run: |
          set -euo pipefail
          curl -fsSL -o 1033931-scout-chat.png "$CHAT_URL"
          curl -fsSL -o 1033931-scout-emulator-chrome.png "$CHROME_URL"
          python3 - <<'PY'
          from pathlib import Path
          for p in ['1033931-scout-chat.png','1033931-scout-emulator-chrome.png']:
              b=Path(p).read_bytes()
              assert b[:8]==b'\x89PNG\r\n\x1a\n', (p, b[:16])
              print(p, 'ok', len(b))
          PY
      - name: Commit PNGs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 1033931-scout-chat.png 1033931-scout-emulator-chrome.png
          git commit -m 'Add Scout Android chat screenshots for Origin 1033931'
          git push
